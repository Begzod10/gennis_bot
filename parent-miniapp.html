<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ota-ona kabineti</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f3f4f6;
            padding-bottom: 72px;
            color: #111827;
        }
        .header {
            background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
            color: white;
            padding: 20px 16px 16px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 20px; font-weight: 800; }
        .header p { font-size: 12px; opacity: 0.75; margin-top: 4px; }

        .content { padding: 16px 14px; }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .card h3 {
            margin: 0 0 12px;
            font-size: 15px;
            font-weight: 700;
            color: #1e1b4b;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
        }
        .card-row:last-child { border-bottom: none; }
        .label { color: #64748b; font-weight: 500; }
        .value { color: #1e1b4b; font-weight: 700; }

        .badge {
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge.green { background: #ecfdf5; color: #059669; }
        .badge.blue  { background: #eff6ff; color: #2563eb; }
        .badge.red   { background: #fef2f2; color: #dc2626; }
        .badge.gray  { background: #f1f5f9; color: #64748b; }
        .badge.amber { background: #fffbeb; color: #d97706; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .stat-box {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .stat-box .num { font-size: 24px; font-weight: 800; color: #3b82f6; }
        .stat-box .lbl { font-size: 11px; color: #64748b; margin-top: 4px; font-weight: 600; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #fff;
            display: flex; justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 10px; color: #94a3b8; gap: 3px;
            border: none; background: none; cursor: pointer;
            transition: color 0.2s; padding: 4px 8px;
        }
        .nav-item.active { color: #3b82f6; }
        .nav-item svg { width: 20px; height: 20px; }

        .tab { display: none; }
        .tab.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .spinner-wrap { text-align: center; padding: 40px; color: #64748b; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box {
            background: #fef2f2; color: #dc2626;
            border-radius: 12px; padding: 14px;
            font-size: 13px; line-height: 1.5;
            border: 1px solid #fee2e2;
        }

        .not-registered {
            background: #fffbeb; color: #92400e;
            border-radius: 8px; padding: 8px 10px;
            font-size: 12px; margin-top: 8px;
            border: 1px solid #fde68a;
        }

        .section-title {
            font-size: 12px; font-weight: 600; color: #64748b;
            margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        .pill-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .pill {
            background: #f1f5f9; border-radius: 20px;
            padding: 4px 10px; font-size: 12px; color: #475569;
        }

        .att-present { color: #059669; }
        .att-absent  { color: #dc2626; }

        .profile-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: #1e1b4b; display: flex; align-items: center;
            justify-content: center; margin: 12px auto 8px;
            font-size: 32px; color: white;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🌟 Ota-ona kabineti</h1>
    <p id="headerSub">Yuklanmoqda...</p>
</div>

<div class="content">
    <div class="tab active" id="tab-home">
        <div class="spinner-wrap"><div class="spinner"></div>Ma'lumotlar yuklanmoqda...</div>
    </div>
    <div class="tab" id="tab-progress">
        <div class="spinner-wrap"><div class="spinner"></div>Yuklanmoqda...</div>
    </div>
    <div class="tab" id="tab-payments">
        <div class="spinner-wrap"><div class="spinner"></div>Yuklanmoqda...</div>
    </div>
    <div class="tab" id="tab-attendance">
        <div class="spinner-wrap"><div class="spinner"></div>Yuklanmoqda...</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('home',this)">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        Asosiy
    </button>
    <button class="nav-item" onclick="switchTab('progress',this)">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        Natijalar
    </button>
    <button class="nav-item" onclick="switchTab('payments',this)">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/>
        </svg>
        To'lovlar
    </button>
    <button class="nav-item" onclick="switchTab('attendance',this)">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        Davomat
    </button>
</div>

<script>
    const API = 'https://tech.gennis.uz/api/v1';

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const params = new URLSearchParams(window.location.search);
    const parentId  = params.get('parent_id') || '';
    const childrenQ = params.get('children')   || '';   // pre-filled by bot

    function switchTab(name, btn) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    function showError(tabId, msg) {
        document.getElementById(tabId).innerHTML =
            '<div class="error-box">⚠️ ' + msg + '</div>';
    }

    function esc(str) {
        return String(str || '')
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function levelBadge(lvl) {
        const map = { Beginner: 'gray', Intermediate: 'blue', Advanced: 'green' };
        return `<span class="badge ${map[lvl] || 'gray'}">${esc(lvl)}</span>`;
    }

    // ── Renderers ─────────────────────────────────────────────────────────────

    function renderHome(data) {
        const ch = data.children || [];
        if (!ch.length) {
            document.getElementById('tab-home').innerHTML =
                '<div class="spinner-wrap">Farzandlar topilmadi</div>';
            document.getElementById('headerSub').textContent = 'Farzand topilmadi';
            return;
        }

        const totalPoints   = ch.reduce((a, c) => a + (c.points || 0), 0);
        const totalProjects = ch.reduce((a, c) => a + (c.projects_count || 0), 0);
        const totalCerts    = ch.reduce((a, c) => a + (c.certificates_count || 0), 0);

        let h = '<div class="stat-grid">' +
            `<div class="stat-box"><div class="num">${ch.length}</div><div class="lbl">Farzandlar</div></div>` +
            `<div class="stat-box"><div class="num">${totalPoints}</div><div class="lbl">Umumiy ball</div></div>` +
            `<div class="stat-box"><div class="num">${totalProjects}</div><div class="lbl">Loyihalar</div></div>` +
            `<div class="stat-box"><div class="num">${totalCerts}</div><div class="lbl">Sertifikatlar</div></div>` +
            '</div>';

        ch.forEach(c => {
            const notReg = !c.found_in_platform
                ? '<div class="not-registered">⚠️ Bu o\'quvchi hali platformaga kirmagan</div>'
                : '';
            h += `<div class="card">
                <h3>👦 ${esc(c.name)}</h3>
                ${notReg}
                <div class="card-row"><span class="label">Daraja:</span>${levelBadge(c.level)}</div>
                <div class="card-row"><span class="label">Guruh:</span><span class="value">${esc(c.gennis_group || '—')}</span></div>
                <div class="card-row"><span class="label">Ball:</span><span class="value" style="color:#3b82f6;">${c.points || 0}</span></div>
                <div class="card-row"><span class="label">Streak:</span><span class="value">🔥 ${c.streak || 0} kun</span></div>
                <div class="card-row"><span class="label">Loyihalar:</span><span class="value">${c.projects_count || 0} ta</span></div>
                <div class="card-row"><span class="label">Sertifikatlar:</span><span class="badge green">${c.certificates_count || 0} ta</span></div>
            </div>`;
        });

        document.getElementById('tab-home').innerHTML = h;
        document.getElementById('headerSub').textContent = ch.length + ' ta farzand';
    }

    function renderProgress(data) {
        const ch = data.children || [];
        if (!ch.length) {
            document.getElementById('tab-progress').innerHTML =
                '<div class="spinner-wrap">Ma\'lumot topilmadi</div>';
            return;
        }

        let h = '';
        ch.forEach(c => {
            h += `<div class="card"><h3>⭐ ${esc(c.name)}</h3>`;

            // Stats row
            h += `<div class="card-row"><span class="label">Daraja:</span>${levelBadge(c.level)}</div>`;
            h += `<div class="card-row"><span class="label">Umumiy ball:</span><span class="value" style="color:#3b82f6;">${c.points || 0}</span></div>`;

            if (c.ranking) {
                const r = c.ranking;
                h += `<div class="card-row"><span class="label">Global reyting:</span><span class="value">#${r.global_rank || '—'}</span></div>`;
                h += `<div class="card-row"><span class="label">O'rtacha baho:</span><span class="value">${r.average_grade ? r.average_grade.toFixed(1) : '—'}</span></div>`;
            }

            h += `<div class="card-row"><span class="label">Streak:</span><span class="value">🔥 ${c.streak || 0} (eng uzun: ${c.longest_streak || 0})</span></div>`;

            // Active courses
            const active = c.active_courses || [];
            h += `<div class="section-title">Joriy kurslar (${active.length})</div>`;
            if (active.length) {
                h += '<div class="pill-list">' + active.map(k => `<span class="pill">📘 ${esc(k.title)}</span>`).join('') + '</div>';
            } else {
                h += '<p style="font-size:12px;color:#94a3b8;padding:4px 0;">Faol kurslar yo\'q</p>';
            }

            // Completed courses
            const done = c.completed_courses || [];
            if (done.length) {
                h += `<div class="section-title">Tugatilgan kurslar (${done.length})</div>`;
                h += '<div class="pill-list">' + done.map(k => `<span class="pill" style="background:#ecfdf5;color:#059669;">✅ ${esc(k.title)}</span>`).join('') + '</div>';
            }

            // Projects
            const projs = c.projects || [];
            if (projs.length) {
                h += `<div class="section-title">Loyihalar (${projs.length})</div>`;
                projs.slice(0, 5).forEach(p => {
                    const gradeBadge = p.grade
                        ? `<span class="badge green">${esc(p.grade)}</span>`
                        : `<span class="badge gray">${esc(p.status || 'Qoralama')}</span>`;
                    h += `<div class="card-row" style="font-size:12px;">
                        <span>📁 ${esc(p.title)}</span>${gradeBadge}
                    </div>`;
                });
            }

            // Achievements
            const ach = c.achievements || [];
            if (ach.length) {
                h += `<div class="section-title">Yutuqlar (${ach.length})</div>`;
                h += '<div class="pill-list">' + ach.map(a => `<span class="pill">🏆 ${esc(a.name)}</span>`).join('') + '</div>';
            }

            h += '</div>';
        });

        document.getElementById('tab-progress').innerHTML = h;
    }

    function renderPayments(data) {
        const ch = data.children || [];
        if (!ch.length) {
            document.getElementById('tab-payments').innerHTML =
                '<div class="spinner-wrap">To\'lov ma\'lumotlari topilmadi</div>';
            return;
        }

        let h = '';
        ch.forEach(c => {
            const balance = c.balance || 0;
            const balColor = balance < 0 ? '#ef4444' : '#10b981';

            h += `<div class="card"><h3>💰 ${esc(c.name)}</h3>`;
            h += `<div class="card-row"><span class="label">Balans:</span>
                  <span class="value" style="color:${balColor};">${balance.toLocaleString()} so'm</span></div>`;

            const payments = c.payments || [];
            h += `<div class="section-title">To'lovlar tarixi (${payments.length})</div>`;
            if (payments.length) {
                payments.slice(0, 10).forEach(p => {
                    h += `<div class="card-row" style="font-size:12px;">
                        <span class="label">${esc(p.date || '—')}</span>
                        <span class="value" style="color:#10b981;">+${p.amount ? Number(p.amount).toLocaleString() : '0'} so'm</span>
                    </div>`;
                });
            } else {
                h += '<p style="font-size:12px;color:#999;padding:6px 0;">To\'lovlar topilmadi</p>';
            }
            h += '</div>';
        });

        document.getElementById('tab-payments').innerHTML = h;
    }

    function renderAttendance(data) {
        const ch = data.children || [];
        if (!ch.length) {
            document.getElementById('tab-attendance').innerHTML =
                '<div class="spinner-wrap">Davomat ma\'lumotlari topilmadi</div>';
            return;
        }

        let h = '';
        ch.forEach(c => {
            h += `<div class="card"><h3>📅 ${esc(c.name)}</h3>`;
            const att = c.attendance || {};
            if (!att.year) {
                h += '<p style="font-size:13px;color:#94a3b8;padding:4px 0;">Davomat ma\'lumoti mavjud emas</p>';
                h += '</div>';
                return;
            }

            h += `<div class="card-row"><span class="label">Yil/Oy:</span>
                  <span class="value">${esc(att.year)} — ${esc(att.month)}</span></div>`;

            const tables = att.tables || [];
            if (tables.length) {
                tables.forEach(tbl => {
                    if (tbl.group_name) {
                        h += `<div class="section-title">${esc(tbl.group_name)}</div>`;
                    }
                    const lessons = tbl.lessons || tbl.dates || [];
                    if (lessons.length) {
                        h += '<div style="display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;">';
                        lessons.forEach(lesson => {
                            const present = lesson.present ?? lesson.attended ?? lesson.status === 'present';
                            const dateStr = esc(lesson.date || lesson.day || '');
                            const cls = present ? 'att-present' : 'att-absent';
                            const icon = present ? '✅' : '❌';
                            h += `<div style="text-align:center;min-width:36px;">
                                <div class="${cls}" style="font-size:14px;">${icon}</div>
                                <div style="font-size:10px;color:#64748b;">${dateStr}</div>
                            </div>`;
                        });
                        h += '</div>';
                    } else {
                        h += '<p style="font-size:12px;color:#94a3b8;">Dars qayd qilinmagan</p>';
                    }
                });
            } else {
                h += '<p style="font-size:13px;color:#94a3b8;padding:4px 0;">Bu oy uchun davomat yo\'q</p>';
            }
            h += '</div>';
        });

        document.getElementById('tab-attendance').innerHTML = h;
    }

    // ── Load ──────────────────────────────────────────────────────────────────

    async function loadData() {
        if (!parentId) {
            ['home', 'progress', 'payments', 'attendance'].forEach(id =>
                showError('tab-' + id, 'Parent ID topilmadi. Botdan qayta oching.')
            );
            return;
        }

        const qs = `?children=${encodeURIComponent(childrenQ)}`;
        const headers = { 'Content-Type': 'application/json' };
        if (tg.initData) headers['X-Telegram-Init-Data'] = tg.initData;

        try {
            const [progRes, payRes, attRes] = await Promise.all([
                fetch(`${API}/parent/progress/${parentId}${qs}`, { headers }),
                fetch(`${API}/parent/payments/${parentId}${qs}`, { headers }),
                fetch(`${API}/parent/attendance/${parentId}${qs}`, { headers }),
            ]);

            if (!progRes.ok) throw new Error(`Ma'lumot yuklanmadi (${progRes.status})`);

            const progData = await progRes.json();
            renderHome(progData);
            renderProgress(progData);

            if (payRes.ok) renderPayments(await payRes.json());
            else showError('tab-payments', `To'lov ma'lumoti yuklashda xatolik (${payRes.status})`);

            if (attRes.ok) renderAttendance(await attRes.json());
            else showError('tab-attendance', `Davomat ma'lumoti yuklashda xatolik (${attRes.status})`);

        } catch (e) {
            console.error(e);
            ['tab-home', 'tab-progress', 'tab-payments', 'tab-attendance'].forEach(id =>
                showError(id, e.message)
            );
        }
    }

    loadData();
</script>
</body>
</html>
